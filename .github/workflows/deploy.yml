name: Deploy MFE Dashboard to GitHub Pages

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action/setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build remote-products
        run: pnpm --filter @mfe-dashboard/remote-products build
        env:
          VITE_REMOTE_BASE_NAME: remote-products

      - name: Build remote-sales-graph
        run: pnpm --filter @mfe-dashboard/remote-sales-graph build
        env:
          VITE_REMOTE_BASE_NAME: remote-sales-graph

      - name: Build remote-weather
        run: pnpm --filter @mfe-dashboard/remote-weather build
        env:
          VITE_REMOTE_BASE_NAME: remote-weather

      - name: Build remote-currency-rate
        run: pnpm --filter @mfe-dashboard/remote-currency-rate build
        env:
          VITE_REMOTE_BASE_NAME: remote-currency-rate

      - name: Build host
        run: pnpm --filter @mfe-dashboard/host build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
